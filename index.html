<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Астрель</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: -apple-system, system-ui, sans-serif; }
  body { margin:0; min-height:100vh; background: linear-gradient(160deg,#2b1055,#7597de); color:#fff; padding:20px; }
  h1 { text-align:center; margin:10px 0 4px; }
  .subtitle { text-align:center; opacity:.85; margin-bottom:20px; font-size:14px; }
  .card { background: rgba(255,255,255,.1); border-radius:16px; padding:20px; max-width:440px; margin:0 auto; }
  .tabs { display:flex; gap:10px; margin-bottom:20px; }
  .tab { flex:1; text-align:center; padding:12px; background:rgba(255,255,255,.1); border-radius:10px; cursor:pointer; font-weight:600; opacity:0.6; transition:.2s; font-size:14px; }
  .tab.active { opacity:1; background:rgba(255,209,102,.2); color:#ffd166; border:1px solid rgba(255,209,102,.4); }
  .partner-title { font-size:16px; font-weight:700; color:#ffd166; margin:10px 0; text-align:center; display:none; }
  .partner2-fields { display:none; margin-top:20px; padding-top:20px; border-top:1px dashed rgba(255,255,255,.2); }
  label { display:block; margin:12px 0 4px; font-size:14px; opacity:.9; }
  input, select { width:100%; padding:12px; border:none; border-radius:10px; font-size:16px; }
  button#btn { width:100%; margin-top:20px; padding:16px; border:none; border-radius:12px; background:#ffd166; color:#2b1055; font-size:17px; font-weight:800; cursor:pointer; box-shadow:0 0 0 0 rgba(255,209,102,.7); animation: btnPulse 1.8s ease-in-out infinite; transition: transform .1s ease; }
  button#btn:active { transform: scale(.98); }
  button#btn:disabled { opacity:.6; animation:none; cursor:default; }
  @keyframes btnPulse { 0%,100% { box-shadow:0 0 0 0 rgba(255,209,102,.55); } 50% { box-shadow:0 0 22px 7px rgba(255,209,102,.55); } }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:rgba(255,255,255,.08); border-radius:10px; margin-bottom:6px; }
  .row .planet { font-weight:600; }
  .row .pos { text-align:right; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .asc { background:rgba(255,209,102,.25); }
  .badge { font-size:11px; padding:2px 8px; border-radius:8px; white-space:nowrap; font-weight:600; }
  .badge.strong { background:rgba(255,209,102,.30); color:#ffd166; }
  .badge.weak   { background:rgba(255,140,140,.25); color:#ffb3b3; }
  .badge.tip { cursor:help; position:relative; }
  .badge.tip::after { content:attr(data-tip); position:absolute; bottom:140%; right:0; width:210px; background:#1a0a3a; color:#fff; border:1px solid rgba(255,209,102,.45); padding:8px 10px; border-radius:8px; font-size:12px; font-weight:400; line-height:1.45; white-space:normal; text-align:left; opacity:0; pointer-events:none; transition:opacity .15s; z-index:60; box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .badge.tip:hover::after { opacity:1; }
  .cmp { width:100%; margin-bottom:6px; }
  .cmp-head { display:flex; gap:6px; margin-bottom:8px; }
  .cmp-head div { flex:1; text-align:center; font-weight:700; color:#ffd166; font-size:13px; padding:6px; background:rgba(255,209,102,.15); border-radius:8px; }
  .cmp-row { display:flex; gap:6px; align-items:stretch; margin-bottom:6px; }
  .cmp-cell { flex:1; background:rgba(255,255,255,.08); border-radius:8px; padding:8px 6px; text-align:center; font-size:13px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
  .cmp-mid { flex:0 0 84px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; opacity:.85; }
  .cmp-cell.asc { background:rgba(255,209,102,.22); }
  .muted { opacity:.75; font-size:13px; text-align:center; margin-top:10px; }
  .horoscope { background:rgba(255,255,255,.08); border-radius:10px; padding:16px; font-size:14px; line-height:1.55; margin-top:14px; animation: fadeIn .6s ease; }
  .horoscope p { margin:0 0 10px; }
  .horoscope h3 { margin:15px 0 5px; color:#ffd166; font-size:16px; }
  .horoscope strong { color:#ffd166; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .share { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .share-btn { flex:1; min-width:140px; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; background:rgba(255,255,255,.15); color:#fff; transition: transform .1s ease; }
  .share-btn.vk { background:#4a76a8; color:#fff; }
  .share-btn:active { transform: scale(.98); }
  .clear-btn { width:100%; background:transparent; color:#fff; opacity:.6; font-size:13px; font-weight:400; margin-top:10px; text-decoration:underline; border:none; cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#ffd166; color:#2b1055; padding:10px 18px; border-radius:10px; font-weight:700; font-size:14px; opacity:0; pointer-events:none; transition:.3s; z-index:100; max-width:90%; text-align:center; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .loader { text-align:center; padding:26px 12px 18px; }
  .spinner { width:64px; height:64px; margin:0 auto; position:relative; }
  .spinner::before { content:''; position:absolute; inset:0; border-radius:50%; border:3px solid rgba(255,209,102,.22); border-top-color:#ffd166; animation: spin 1s linear infinite; }
  .spinner .center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:26px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.25);} }
  .loader .txt { margin-top:14px; font-size:15px; opacity:.95; }
  .history { margin-top:16px; }
  .hist-title { font-size:13px; opacity:.8; margin-bottom:8px; }
  .hist-list { display:flex; flex-wrap:wrap; gap:8px; }
  .hist-item { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,209,102,.3); border-radius:16px; padding:6px 12px; font-size:13px; cursor:pointer; transition:.15s; }
  .hist-item:hover { background:rgba(255,209,102,.25); color:#ffd166; }
  .scorebox { margin:14px 0 4px; }
  .score-overall { text-align:center; margin-bottom:14px; }
  .score-pct { font-size:38px; font-weight:800; color:#ffd166; line-height:1; }
  .score-label { font-size:14px; opacity:.9; margin-top:4px; }
  .score-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .score-name { flex:0 0 132px; font-size:13px; display:flex; align-items:center; gap:4px; }
  .score-bar { flex:1; height:10px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
  .score-fill { height:100%; background:linear-gradient(90deg,#ffd166,#ff9a66); border-radius:6px; transition:width .8s ease; }
  .score-val { flex:0 0 40px; text-align:right; font-size:13px; font-weight:700; color:#ffd166; }
  .score-q { cursor:help; opacity:.75; }

  .celeb-intro { background:rgba(255,255,255,.08); border-radius:12px; padding:14px; margin:10px 0 14px; font-size:14px; line-height:1.45; }
  .celeb-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .celeb-card { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:10px 12px; }
  .celeb-card.top { background:rgba(255,209,102,.16); border-color:rgba(255,209,102,.38); }
  .celeb-rank { flex:0 0 30px; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(255,209,102,.20); color:#ffd166; font-weight:800; font-size:13px; }
  .celeb-main { flex:1; min-width:0; }
  .celeb-name { font-weight:800; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .celeb-label { opacity:.78; font-size:12px; margin-top:2px; }
  .celeb-pct { flex:0 0 58px; text-align:right; font-size:20px; font-weight:900; color:#ffd166; }
  .celeb-progress { background:rgba(255,255,255,.08); border-radius:12px; padding:16px; text-align:center; line-height:1.45; }
  .celeb-small { opacity:.75; font-size:12px; margin-top:8px; }

</style>
</head>
<body>
  <h1>✨ Астрель</h1>
  <div class="subtitle">Астрология и гороскоп в одном месте</div>
  <div class="card">
    <div class="tabs">
      <div class="tab active" id="tab-horo">🔮 Личный гороскоп</div>
      <div class="tab" id="tab-syn">❤️ Совместимость</div>
      <div class="tab" id="tab-celebs">😎 Селебы</div>
    </div>
    <div id="partner1-title" class="partner-title">Ваши данные</div>
    <div id="prof1-wrap">
      <label>Профиль</label>
      <select id="prof1"><option value="">➕ Создать новый профиль</option></select>
    </div>
    <div id="fields1">
    <label>Имя</label> <input id="name" placeholder="Ваше имя">
    <label>Дата рождения</label> <input id="date" type="date">
    <label>Время рождения</label> <input id="time" type="time">
    <label>Место рождения</label> <input id="place" placeholder="Москва">
    </div>
    <div id="partner2-fields" class="partner2-fields">
      <div class="partner-title" style="display:block;">Данные партнёра</div>
      <label>Профиль</label>
      <select id="prof2"><option value="">➕ Создать новый профиль</option></select>
      <div id="fields2">
      <label>Имя партнёра</label> <input id="name2" placeholder="Имя партнёра">
      <label>Дата рождения</label> <input id="date2" type="date">
      <label>Время рождения</label> <input id="time2" type="time">
      <label>Место рождения</label> <input id="place2" placeholder="Санкт-Петербург">
      </div>
    </div>
    <label>Система зодиака</label>
    <select id="zodiac">
      <option value="sidereal" selected>Сидерическая (ведическая)</option>
      <option value="tropical">Тропическая (западная)</option>
    </select>
    <button id="btn">Построить гороскоп 🔮</button>
    <div id="result"></div>
    <div id="horoscope"></div>
    <button id="clearBtn" class="clear-btn">🧹 Очистить поля</button>
    <div id="history" class="history"></div>
    <div id="synHistory" class="history"></div>
    <!-- DEV-RESET START (временная кнопка для тестов — удалить перед релизом) -->
    <button id="devReset" class="clear-btn" style="display:none;margin-top:8px;background:rgba(255,80,80,.25);border:1px solid rgba(255,120,120,.5);">🧪 Сброс истории и кэша (тест)</button>
    <!-- DEV-RESET END -->
  </div>
  <footer style='text-align:center;padding:18px 12px 24px;font-size:13px;color:#9a8fb5;'>
    <a id='dev-blog-link' href='https://t.me/bothub_founder' target='_blank' rel='noopener' style='color:#b388ff;text-decoration:none;'>📣 Блог разработчика</a>
  </footer>
  <div id="toast" class="toast"></div>
<script>
  const bridge = window.vkBridge;
  if (bridge) { bridge.send('VKWebAppInit'); }
  (function(){var _bl=document.getElementById('dev-blog-link');if(_bl){_bl.addEventListener('click',function(ev){if(typeof bridge!=='undefined'&&bridge&&bridge.isEmbedded&&bridge.isEmbedded()){ev.preventDefault();bridge.send('VKWebAppOpenLink',{url:_bl.href});}});}})();
  const APP_LINK = 'https://vk.com/app54633941';
  const fields = ['name','date','time','place','zodiac','name2','date2','time2','place2'];
  function loadSaved() {
    const saved = localStorage.getItem('astrel_user');
    if (saved) { try { const d = JSON.parse(saved); fields.forEach(f => { if (d[f]) document.getElementById(f).value = d[f]; }); } catch(e){} }
  }
  function saveData() {
    const d = {};
    fields.forEach(f => { const el = document.getElementById(f); if (el) d[f] = el.value; });
    localStorage.setItem('astrel_user', JSON.stringify(d));
  }
  loadSaved();
  const DIGNITY = {
    'Солнце':   { обитель:['Лев'],              экзальтация:'Овен',     падение:'Весы',     изгнание:['Водолей'] },
    'Луна':     { обитель:['Рак'],              экзальтация:'Телец',    падение:'Скорпион', изгнание:['Козерог'] },
    'Меркурий': { обитель:['Близнецы','Дева'],  экзальтация:'Дева',     падение:'Рыбы',     изгнание:['Стрелец','Рыбы'] },
    'Венера':   { обитель:['Телец','Весы'],     экзальтация:'Рыбы',     падение:'Дева',     изгнание:['Овен','Скорпион'] },
    'Марс':     { обитель:['Овен','Скорпион'],  экзальтация:'Козерог',  падение:'Рак',      изгнание:['Телец','Весы'] },
    'Юпитер':   { обитель:['Стрелец','Рыбы'],   экзальтация:'Рак',      падение:'Козерог',  изгнание:['Близнецы','Дева'] },
    'Сатурн':   { обитель:['Козерог','Водолей'],экзальтация:'Весы',     падение:'Овен',     изгнание:['Рак','Лев'] },
  };
  function dignityBadge(planet, sign) {
    const d = DIGNITY[planet];
    if (!d) return '';
    if (d.экзальтация === sign) return '<span class="badge strong tip" data-tip="👑 Экзальтация — планета в гостях у силы: проявляется ярко, на максимуме своих качеств.">👑</span>';
    if (d.обитель.includes(sign)) return '<span class="badge strong tip" data-tip="🏠 Обитель — планета у себя дома: чувствует себя уверенно и свободно.">🏠</span>';
    if (d.падение === sign) return '<span class="badge weak tip" data-tip="💔 Падение — планета ослаблена: её качества даются с трудом. Это зона роста.">💔</span>';
    if (d.изгнание.includes(sign)) return '<span class="badge weak tip" data-tip="🚪 Изгнание — планета не в своей тарелке: действует через сопротивление.">🚪</span>';
    return '';
  }
  document.addEventListener('click', function(e){ var _t = e.target.closest && e.target.closest('.badge.tip'); if (_t) toast(_t.getAttribute('data-tip')); });
  document.addEventListener('click', function(e){
    var _h = e.target.closest && e.target.closest('.hist-item');
    if (!_h) return;
    if (_h.hasAttribute('data-syn')) loadSynFromHistory(decodeURIComponent(_h.getAttribute('data-syn')));
    else if (_h.hasAttribute('data-sig')) loadFromHistory(decodeURIComponent(_h.getAttribute('data-sig')));
  });
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch(e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      let ok=false; try { ok=document.execCommand('copy'); } catch(_){}
      document.body.removeChild(ta); return ok;
    }
  }
  function refreshBtnHTML() {
    return '<button class="clear-btn" onclick="refreshHoroscope()" style="margin-top:12px;">🔄 Обновить гороскоп</button>';
  }
  const HORO_DAY = 24*60*60*1000;
  function horoSig() {
    return [
      document.getElementById('date').value,
      document.getElementById('time').value,
      (document.getElementById('place').value || '').trim().toLowerCase(),
      document.getElementById('zodiac').value
    ].join('|');
  }
  function readHoroCache() {
    try { return JSON.parse(localStorage.getItem('astrel_horo_cache')) || {}; } catch(e) { return {}; }
  }
  function getCachedHoro(sig) {
    const item = readHoroCache()[sig];
    return (item && item.horoscope) ? item : null;
  }
  function cacheHoroscope() {
    const c = readHoroCache();
    c[horoSig()] = {
      result: document.getElementById('result').innerHTML,
      horoscope: document.getElementById('horoscope').innerHTML,
      data: {
        name: document.getElementById('name').value,
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        place: document.getElementById('place').value,
        zodiac: document.getElementById('zodiac').value
      },
      ts: Date.now()
    };
    const keys = Object.keys(c).sort((a,b) => (c[a].ts||0) - (c[b].ts||0));
    while (keys.length > 15) { delete c[keys.shift()]; }
    try { localStorage.setItem('astrel_horo_cache', JSON.stringify(c)); } catch(e) {}
    renderHistory();
    populateProfiles();
  }
  function restoreHoroscope() {
    if (mode !== 'horo') return;
    const item = getCachedHoro(horoSig());
    if (!item) return;
    document.getElementById('result').innerHTML = item.result || '';
    document.getElementById('horoscope').innerHTML = item.horoscope;
    if (typeof bindShare === 'function') bindShare();
  }
  function refreshHoroscope() {
    btn.click();
  }
  function escapeHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function scoresHTML(sc) {
    if (!sc || !sc.criteria) return '';
    let h = '<div class="scorebox"><div class="score-overall"><div class="score-pct">' + sc.overall + '%</div><div class="score-label">' + escapeHtml(sc.label) + '</div></div>';
    sc.criteria.forEach(c => {
      const tip = (c.details && c.details.length) ? c.details.join(' • ') : 'Явных аспектов нет — нейтрально';
      h += '<div class="score-row">'
        + '<div class="score-name">' + c.emoji + ' ' + c.name + ' <span class="badge tip score-q" data-tip="' + escapeHtml(tip) + '">?</span></div>'
        + '<div class="score-bar"><div class="score-fill" style="width:' + c.score + '%"></div></div>'
        + '<div class="score-val">' + c.score + '%</div></div>';
    });
    h += '</div>';
    return h;
  }
  function renderHistory() {
    const box = document.getElementById('history');
    if (!box) return;
    if (mode !== 'horo') { box.innerHTML = ''; return; }
    const c = readHoroCache();
    const keys = Object.keys(c).sort((a,b) => (c[b].ts||0) - (c[a].ts||0));
    if (!keys.length) { box.innerHTML = ''; return; }
    let html = '<div class="hist-title">🕘 История</div><div class="hist-list">';
    keys.forEach(k => {
      const d = (c[k] && c[k].data) || {};
      const label = d.name && d.name.trim() ? d.name.trim() : (d.date || 'Без имени');
      html += '<button class="hist-item" data-sig="' + encodeURIComponent(k) + '">' + escapeHtml(label) + '</button>';
    });
    html += '</div>';
    box.innerHTML = html;
  }
  function loadFromHistory(sig) {
    const it = readHoroCache()[sig];
    if (!it) return;
    if (it.data) {
      ['name','date','time','place','zodiac'].forEach(f => {
        const el = document.getElementById(f);
        if (el && it.data[f] != null) el.value = it.data[f];
      });
      saveData();
    }
    document.getElementById('result').innerHTML = it.result || '';
    document.getElementById('horoscope').innerHTML = it.horoscope || '';
    if (typeof bindShare === 'function') bindShare();
    resetProfilePickers();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function personSig(d, t, pl, z) {
    return [d, t, (pl||'').trim().toLowerCase(), z].join('|');
  }
  function readSynCache() {
    try { return JSON.parse(localStorage.getItem('astrel_syn_cache')) || {}; } catch(e) { return {}; }
  }
  function cacheSynastry() {
    const g = id => document.getElementById(id).value;
    const z = g('zodiac');
    const sig = personSig(g('date'),g('time'),g('place'),z) + '~~' + personSig(g('date2'),g('time2'),g('place2'),z);
    const c = readSynCache();
    c[sig] = {
      result: document.getElementById('result').innerHTML,
      horoscope: document.getElementById('horoscope').innerHTML,
      data: { name:g('name'),date:g('date'),time:g('time'),place:g('place'),
              name2:g('name2'),date2:g('date2'),time2:g('time2'),place2:g('place2'),zodiac:z },
      ts: Date.now()
    };
    const keys = Object.keys(c).sort((a,b) => (c[a].ts||0) - (c[b].ts||0));
    while (keys.length > 15) { delete c[keys.shift()]; }
    try { localStorage.setItem('astrel_syn_cache', JSON.stringify(c)); } catch(e) {}
    renderSynHistory();
  }
  function renderSynHistory() {
    const box = document.getElementById('synHistory');
    if (!box) return;
    if (mode !== 'syn') { box.innerHTML = ''; return; }
    const c = readSynCache();
    const keys = Object.keys(c).sort((a,b) => (c[b].ts||0) - (c[a].ts||0));
    if (!keys.length) { box.innerHTML = ''; return; }
    let html = '<div class="hist-title">🕘 История пар</div><div class="hist-list">';
    keys.forEach(k => {
      const d = (c[k] && c[k].data) || {};
      const n1 = (d.name && d.name.trim()) || d.date || '?';
      const n2 = (d.name2 && d.name2.trim()) || d.date2 || '?';
      html += '<button class="hist-item" data-syn="' + encodeURIComponent(k) + '">' + escapeHtml(n1) + ' + ' + escapeHtml(n2) + '</button>';
    });
    html += '</div>';
    box.innerHTML = html;
  }
  function loadSynFromHistory(sig) {
    const it = readSynCache()[sig];
    if (!it) return;
    if (it.data) {
      ['name','date','time','place','name2','date2','time2','place2','zodiac'].forEach(f => {
        const el = document.getElementById(f);
        if (el && it.data[f] != null) el.value = it.data[f];
      });

        const sig = horoSig();
        const cached = getCachedHoro(sig);
        if (cached && (Date.now() - cached.ts) < HORO_DAY) {
          document.getElementById('result').innerHTML = cached.result || '';
          horoBox.innerHTML = cached.horoscope;
          if (typeof bindShare === 'function') bindShare();
          const h = Math.max(1, Math.ceil((HORO_DAY - (Date.now() - cached.ts)) / 3600000));
          toast('Этот гороскоп уже посчитан 🌙 Обновится через ~' + h + ' ч');
          return;
        }
        const name = document.getElementById('name').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const place = document.getElementById('place').value;
        if (!date || !time || !place) { result.innerHTML = '<p class="muted">Заполните данные 🙏</p>'; btn.disabled=false; return; }
        saveData();
        result.innerHTML = loaderHTML('Считаю звёзды', '🌌');
        const natal = await fetchNatal(date, time, place, zodiac);
        result.innerHTML = singleTable(natal);
        horoBox.innerHTML = loaderHTML('Составляю твой гороскоп', '🔮');
        const r = await fetch('/horoscope', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, natal }) });
        const data = await r.json();
        horoBox.innerHTML = '<div class="horoscope">' + data.horoscope + '</div>' + shareButtons() + refreshBtnHTML();
        bindShare();
        cacheHoroscope();
      } else {
        const n1name = document.getElementById('name').value;
        const d1 = document.getElementById('date').value;
        const t1 = document.getElementById('time').value;
        const p1 = document.getElementById('place').value;
        const n2name = document.getElementById('name2').value;
        const d2 = document.getElementById('date2').value;
        const t2 = document.getElementById('time2').value;
        const p2 = document.getElementById('place2').value;
        if (!d1||!t1||!p1||!d2||!t2||!p2) { result.innerHTML = '<p class="muted">Заполните данные обоих партнёров 🙏</p>'; btn.disabled=false; return; }
        saveData();
        result.innerHTML = loaderHTML('Считаю карту первого партнёра', '🌌');
        const natal1 = await fetchNatal(d1, t1, p1, zodiac);
        result.innerHTML = loaderHTML('Считаю карту второго партнёра', '🌌');
        await new Promise(res => setTimeout(res, 1200));
        const natal2 = await fetchNatal(d2, t2, p2, zodiac);
        result.innerHTML = compareTable(natal1, n1name, natal2, n2name);
        horoBox.innerHTML = loaderHTML('Считаю совместимость', '💞');
        const sr = await fetch('/synastry/scores', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name1:n1name, natal1, name2:n2name, natal2 }) });
        const sdata = await sr.json();
        horoBox.innerHTML = scoresHTML(sdata.scores) + loaderHTML('Пишу разбор совместимости', '❤️');
        const r = await fetch('/synastry', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name1:n1name, natal1, name2:n2name, natal2 }) });
        const data = await r.json();
        horoBox.innerHTML = scoresHTML(data.scores) + '<div class="horoscope">' + data.synastry + '</div>' + shareButtons();
        bindShare();
        cacheSynastry();
      }
    } catch(e) {
      result.innerHTML = '<p class="muted">Произошла ошибка 😔 Проверьте названия городов.</p>';
    } finally {
      btn.disabled = false;
    }
  };
  document.getElementById('clearBtn').onclick = () => {
    localStorage.removeItem('astrel_user');
    fields.forEach(f => {
      const el = document.getElementById(f);
      if (!el) return;
      if (f === 'zodiac') el.value = 'sidereal'; else el.value = '';
    });
    toast('Поля очищены 🧹');
  };
  /* DEV-RESET START — удалить перед релизом */
  var _dev = document.getElementById('devReset');
  try { if (_dev && new URLSearchParams(location.search).get('vk_app_id') === '54634753') _dev.style.display = 'block'; } catch (e) {}
  if (_dev) _dev.onclick = () => {
    localStorage.removeItem('astrel_horo_cache');
    localStorage.removeItem('astrel_horoscope');
    localStorage.removeItem('astrel_horo_time');
    localStorage.removeItem('astrel_syn_cache');
    document.getElementById('result').innerHTML = '';
    document.getElementById('horoscope').innerHTML = '';
    renderHistory();
    renderSynHistory();
    populateProfiles();
    toast('История и кэш очищены 🧪');
  };
  /* DEV-RESET END */
  var _p1 = document.getElementById('prof1');
  if (_p1) _p1.onchange = () => { applyProfile(1, decodeURIComponent(_p1.value || '')); toggleFields(1, !!_p1.value); };
  var _p2 = document.getElementById('prof2');
  if (_p2) _p2.onchange = () => { applyProfile(2, decodeURIComponent(_p2.value || '')); toggleFields(2, !!_p2.value); };
  populateProfiles();
  restoreHoroscope();
  renderHistory();
  renderSynHistory();
</script>
</body>
</html>
